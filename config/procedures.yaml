# 시술 사전: 옵션 이름/설명에 keywords 중 하나가 들어 있으면 그 시술로 본다 (대소문자 무시).
# target: skin (피부결·톤·트러블) | face (윤곽·리프팅·볼륨) | body | hair | nail | brow_lip | color | photo | relax
# downtime_grade: none (당일 사진 OK) | low (1~2일 붉은기·부기) | high (3일 이상, 딱지·멍)
# downtime_days: [최소, 최대] 일반적인 회복 일수. 페이지에 명시가 있으면 페이지 값이 우선한다.
# 값은 일반적인 임상 안내 기준의 보수적 추정치이며 source: dictionary 로 표시된다.
# subtype_keywords: 해당 subtype 장소에서만 쓰는 넓은 키워드 (예: 반영구샵의 "eyebrow")
# exclude_subtypes: 이 subtype 장소에서는 매칭하지 않는다 (예: 헤어샵의 "filler care" 는 필러 시술이 아님)

procedures:
  # --- 피부과: face (윤곽 / 리프팅 / 볼륨) ---
  botox:
    keywords: [botox, xeomin, botulinum, dysport, nabota, coretox, "jaw reduction", "masseter"]
    target: face
    downtime_grade: none
    downtime_days: [0, 1]
  filler:
    keywords: [filler, juvederm, restylane, "belotero", "chaeum", "lip filler"]
    exclude_subtypes: [hair_salon, makeup, personal_color, nail_art]
    target: face
    downtime_grade: low
    downtime_days: [1, 3]
  hifu:
    keywords: [hifu, shurink, doublo, ulthera, ultherapy, contrex, liftera, ultraformer, volnewmer]
    target: face
    downtime_grade: none
    downtime_days: [0, 1]
  rf_lifting:
    keywords: [thermage, oligio, onda, inmode, "titanium laser", titanium, potenza, sylfirm, fortra, tuneface, "tune face"]
    target: face
    downtime_grade: none
    downtime_days: [0, 1]
  thread_lift:
    keywords: ["thread lift", "thread lifting", mint lift, "silhouette soft"]
    target: face
    downtime_grade: high
    downtime_days: [3, 7]
  volume_booster:
    keywords: [juvelook volume, sculptra, radiesse, "lenisna", "gouri"]
    target: face
    downtime_grade: low
    downtime_days: [1, 3]
  fat_dissolve:
    keywords: ["fat dissolving", "fat-dissolving", "kabelline", "contour injection", "v-line injection"]
    target: face
    downtime_grade: low
    downtime_days: [1, 3]

  # --- 피부과: skin (피부결 / 톤 / 트러블) ---
  skin_booster:
