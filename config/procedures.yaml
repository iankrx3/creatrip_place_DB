    downtime_grade: none
    downtime_days: [0, 1]
  soothing:
    keywords: ["cryo", "soothing", "regeneration laser", "ldm", "led", "moisturizing mask", "facial care", "skin care", "skincare", "facial"]
    target: skin
    downtime_grade: none
    downtime_days: [0, 0]

  # --- 반영구 ---
  brow_tattoo:
    keywords: ["eyebrow tattoo", "brow tattoo", "semi-permanent eyebrow", "semi-permanent brow", "hairstroke", "hair stroke", "ombre brow", "combo brow", "powder brow", microblading, "eyebrow embroidery"]
