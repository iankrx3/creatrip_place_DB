      permanent_makeup: [eyebrow, eyebrows, brow, brows]
    target: brow_lip
    downtime_grade: high
    downtime_days: [5, 7]
  lip_tattoo:
    keywords: ["lip blush", "lip tattoo", "semi-permanent lip", "lip semi-permanent", "lip pigmentation"]
