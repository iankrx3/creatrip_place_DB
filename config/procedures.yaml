    downtime_grade: high
    downtime_days: [5, 7]
  microneedle:
    keywords: [microneedle, microneedling, "ellisys", "ellisis", "secret rf", "genius rf", "agnes", "mts"]
    target: skin
    downtime_grade: low
    downtime_days: [2, 4]
  acne:
    keywords: [acne, "acu toning", "gold ptt", "extraction", "trouble care", "pimple"]
    target: skin
    downtime_grade: low
    downtime_days: [0, 2]
  peel:
    keywords: ["aqua peel", "lhala peel", "lala peel", "chemical peel", "peeling", "hydrafacial", "hydra facial", "exfoliation", "exfoliating"]
